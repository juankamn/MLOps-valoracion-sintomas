<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1420" viewBox="0 0 1080 1420" style="max-width:100%;height:auto;">
  <defs>
    <marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5c6b7a"/>
    </marker>
    <marker id="flecha-verde" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0f6e6e"/>
    </marker>
    <style>
      .titulo { font: 700 22px "Segoe UI", Arial, sans-serif; fill: #ffffff; }
      .subtitulo { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #d7e3ee; }
      .caja-titulo { font: 700 15px "Segoe UI", Arial, sans-serif; fill: #16324f; }
      .caja-texto { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #3d4c5c; }
      .nota { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #3d4c5c; }
      .ciclo { font: 600 12px "Segoe UI", Arial, sans-serif; fill: #0f6e6e; }
    </style>
  </defs>
  <rect width="1080" height="1420" fill="#f7f4ef"/>
  <rect width="1080" height="78" fill="#16324f"/>
  <text class="titulo" x="36" y="34">Pipeline MLOps para valoración de síntomas</text>
  <text class="subtitulo" x="36" y="58">Enfermedades comunes y huérfanas, de los datos al médico y de vuelta</text>

  <rect x="250" y="102" width="620" height="86" rx="12" fill="#ffffff" stroke="#c5d0dc" stroke-width="1.5"/>
  <text class="caja-titulo" x="270" y="130">E1 · Fuentes de datos</text>
  <text class="caja-texto" x="270" y="154">Historia clínica de la sede y confirmación del especialista.</text>
  <text class="caja-texto" x="270" y="172">El catálogo de fenotipos define la enfermedad; no aporta pacientes.</text>

  <rect x="250" y="216" width="620" height="86" rx="12" fill="#ffffff" stroke="#c5d0dc" stroke-width="1.5"/>
  <text class="caja-titulo" x="270" y="244">E2 · Calidad y privacidad</text>
  <text class="caja-texto" x="270" y="268">Se validan rangos, se quitan duplicados y se separan identificadores.</text>
  <text class="caja-texto" x="270" y="286">Un lote rechazado no sigue.</text>

  <rect x="250" y="330" width="620" height="86" rx="12" fill="#ffffff" stroke="#c5d0dc" stroke-width="1.5"/>
  <text class="caja-titulo" x="270" y="358">E3 · Conjunto de datos versionado</text>
  <text class="caja-texto" x="270" y="382">El conjunto vN es inmutable y se parte por paciente.</text>
  <text class="caja-texto" x="270" y="400">Otro período queda guardado para la prueba final.</text>

  <rect x="250" y="444" width="620" height="86" rx="12" fill="#ffffff" stroke="#c5d0dc" stroke-width="1.5"/>
  <text class="caja-titulo" x="270" y="472">E4 · Variables</text>
  <text class="caja-texto" x="270" y="496">Entran fiebre, dolor, días, número de síntomas, edad y sexo.</text>
  <text class="caja-texto" x="270" y="514">Entrenamiento y servicio usan el mismo diccionario.</text>

  <rect x="90" y="566" width="460" height="128" rx="12" fill="#ffffff" stroke="#0f6e6e" stroke-width="2.5"/>
  <text class="caja-titulo" x="110" y="594">E5a · Enfermedades comunes</text>
  <text class="caja-texto" x="110" y="618">Casos suficientes para entrenar y calibrar.</text>
  <text class="caja-texto" x="110" y="636">Referencia: regresión logística.</text>
  <text class="caja-texto" x="110" y="654">Modelo principal: potenciación de gradiente.</text>

  <rect x="570" y="566" width="460" height="128" rx="12" fill="#ffffff" stroke="#a15c07" stroke-width="2.5"/>
  <text class="caja-titulo" x="590" y="594">E5b · Enfermedades huérfanas</text>
  <text class="caja-texto" x="590" y="618">Pocos casos, sobre una representación ya entrenada.</text>
  <text class="caja-texto" x="590" y="636">No se entrena un modelo desde cero.</text>
  <text class="caja-texto" x="590" y="654">Por debajo del mínimo: alerta genérica.</text>

  <rect x="250" y="734" width="620" height="108" rx="12" fill="#ffffff" stroke="#c5d0dc" stroke-width="1.5"/>
  <text class="caja-titulo" x="270" y="762">E6 · Validación y puerta de promoción</text>
  <text class="caja-texto" x="270" y="786">Comunes: calibración y sensibilidad frente a la referencia.</text>
  <text class="caja-texto" x="270" y="804">Huérfanas: sensibilidad y PR-AUC.</text>
  <text class="caja-texto" x="270" y="822">Un médico revisa los falsos negativos.</text>

  <rect x="250" y="870" width="620" height="86" rx="12" fill="#ffffff" stroke="#c5d0dc" stroke-width="1.5"/>
  <text class="caja-titulo" x="270" y="898">E7 · Registro de la versión</text>
  <text class="caja-texto" x="270" y="922">Se guarda la versión con sus datos, métricas y umbrales.</text>
  <text class="caja-texto" x="270" y="940">Solo esa versión puede entrar en una imagen.</text>

  <rect x="250" y="984" width="620" height="86" rx="12" fill="#ffffff" stroke="#c5d0dc" stroke-width="1.5"/>
  <text class="caja-titulo" x="270" y="1012">E8 · Servicio para el médico</text>
  <text class="caja-texto" x="270" y="1036">Imagen de contenedor con página web y API.</text>
  <text class="caja-texto" x="270" y="1054">Devuelve estado, razón y versión. La decisión es del médico.</text>

  <rect x="250" y="1098" width="620" height="108" rx="12" fill="#ffffff" stroke="#c5d0dc" stroke-width="1.5"/>
  <text class="caja-titulo" x="270" y="1126">E9 · Monitoreo</text>
  <text class="caja-texto" x="270" y="1150">Latencia, síntomas fuera del diccionario y mezcla de estados.</text>
  <text class="caja-texto" x="270" y="1168">La sensibilidad real se mide cuando llega la confirmación.</text>

  <rect x="250" y="1234" width="620" height="86" rx="12" fill="#ffffff" stroke="#c5d0dc" stroke-width="1.5"/>
  <text class="caja-titulo" x="270" y="1262">E10 · Reentrenamiento</text>
  <text class="caja-texto" x="270" y="1286">Comunes cada trimestre, o antes si los datos se desplazan.</text>
  <text class="caja-texto" x="270" y="1304">Huérfanas solo con confirmaciones nuevas. Se despliega el mejor.</text>

  <path d="M560 188 V216" fill="none" stroke="#5c6b7a" stroke-width="2" marker-end="url(#flecha)"/>
  <path d="M560 302 V330" fill="none" stroke="#5c6b7a" stroke-width="2" marker-end="url(#flecha)"/>
  <path d="M560 416 V444" fill="none" stroke="#5c6b7a" stroke-width="2" marker-end="url(#flecha)"/>
  <path d="M560 530 V548" fill="none" stroke="#5c6b7a" stroke-width="2"/>
  <path d="M560 548 H320 V566" fill="none" stroke="#5c6b7a" stroke-width="2" marker-end="url(#flecha)"/>
  <path d="M560 548 H800 V566" fill="none" stroke="#5c6b7a" stroke-width="2" marker-end="url(#flecha)"/>
  <path d="M320 694 V714 H560" fill="none" stroke="#5c6b7a" stroke-width="2"/>
  <path d="M800 694 V714 H560" fill="none" stroke="#5c6b7a" stroke-width="2"/>
  <path d="M560 714 V734" fill="none" stroke="#5c6b7a" stroke-width="2" marker-end="url(#flecha)"/>
  <path d="M560 842 V870" fill="none" stroke="#5c6b7a" stroke-width="2" marker-end="url(#flecha)"/>
  <path d="M560 956 V984" fill="none" stroke="#5c6b7a" stroke-width="2" marker-end="url(#flecha)"/>
  <path d="M560 1070 V1098" fill="none" stroke="#5c6b7a" stroke-width="2" marker-end="url(#flecha)"/>
  <path d="M560 1206 V1234" fill="none" stroke="#5c6b7a" stroke-width="2" marker-end="url(#flecha)"/>

  <path d="M250 1277 H44 V373 H250" fill="none" stroke="#0f6e6e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#flecha-verde)"/>
  <text class="ciclo" x="22" y="820" text-anchor="middle" transform="rotate(-90 22 820)">Nuevas confirmaciones</text>

  <text class="nota" x="90" y="1364">Verde: enfermedades comunes y retorno de confirmaciones a E3. Ámbar: enfermedades huérfanas.</text>
  <text class="nota" x="90" y="1386">Si el candidato no pasa E6, no se despliega.</text>
</svg>
